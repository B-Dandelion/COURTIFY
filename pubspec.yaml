name: courtify
description: "법률신문 기사 작성 지원을 위한 NLP/KoBART 수업 프로젝트 프로토타입 Flutter 클라이언트."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_native_splash:
  color: "#000000"
  image: Assets/Images/Logo_black.png
  fullscreen: true

  android_12:
    color: "#000000"
    image: Assets/Images/Logo_black.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "Assets/Images/Logo_white.png"
  remove_alpha_ios: true

flutter:

  uses-material-design: true

  assets:
    - Assets/
    - Assets/Images/Logo_black.png
    - Assets/Images/Logo_gray.png
    - Assets/Images/Logo_white.png

  fonts:
    - family: SUIT
      fonts:
        - asset: Assets/Fonts/SUIT-Thin.otf
          weight: 100
        - asset: Assets/Fonts/SUIT-ExtraLight.otf
          weight: 200
        - asset: Assets/Fonts/SUIT-Light.otf
          weight: 300
        - asset: Assets/Fonts/SUIT-Regular.otf
          weight: 400
        - asset: Assets/Fonts/SUIT-Medium.otf
          weight: 500
        - asset: Assets/Fonts/SUIT-SemiBold.otf
          weight: 600
        - asset: Assets/Fonts/SUIT-Bold.otf
          weight: 700
        - asset: Assets/Fonts/SUIT-Heavy.otf
          weight: 800
        - asset: Assets/Fonts/SUIT-ExtraBold.otf
          weight: 900
